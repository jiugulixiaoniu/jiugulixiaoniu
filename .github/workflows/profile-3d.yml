name: 3D-contrib-svg
on:
  schedule: [{cron: "0 16 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.ACCESS_TOKEN }}

      - uses: yoshi389111/github-profile-3d-contrib@main
        env:
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USERNAME: jiugulixiaoniu        # 你的用户名
          THEME: night-green               # 主题
          OUTPUT_DIR: profile-3d-contrib   # 输出目录

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib
          git diff --staged --quiet || (git commit -m "chore: generate 3D contrib" && git push)
