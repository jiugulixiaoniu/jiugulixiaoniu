name: 3D-contrib-svg
on:
  schedule: [{cron: "0 16 * * *"}]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.ACCESS_TOKEN }} 

      - uses: yoshi389111/github-profile-3d-contrib@main
        env:
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USERNAME: jiugulixiaoniu     
          SVG_THEME: night-green   
          BRANCH: main
          FOLDER: profile-3d-contrib
